# Paho MQTT-SN gateway settings for the interop tests: a transparent
# gateway on UDP 10000 in front of the Mosquitto broker in the same
# container, with predefined topics (QoS -1 needs a fixed client address, which the
# NAT of a container port does not give).

GatewayID=7
GatewayName=PahoInterop
MaxNumberOfClients=30
KeepAlive=60

BrokerName=127.0.0.1
BrokerPortNo=1883
BrokerSecurePortNo=8883

AggregatingGateway=NO
QoS-1=NO
Forwarder=NO
PredefinedTopic=YES
ClientAuthentication=NO

ClientsList=/etc/paho/clients.conf
PredefinedTopicList=/etc/paho/predefinedTopic.conf

GatewayPortNo=10000
MulticastPortNo=1883
MulticastIP=225.1.1.1
MulticastTTL=1

ShearedMemory=NO
